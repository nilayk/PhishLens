# Everything here is build tooling: package.json has no runtime dependencies, so nothing Dependabot
# updates ends up inside the shipped extension. Updates are grouped to keep the noise down, since a
# single advisory in esbuild otherwise arrives as several overlapping pull requests.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ['*']
    ignore:
      # TypeScript's major version is gated by typescript-eslint's peer range, currently
      # `>=4.8.4 <6.1.0`. Proposing TypeScript 7 produces a pull request npm cannot install at all, so
      # the update fails at `npm ci` rather than at a check that explains itself. Adopt a TypeScript
      # major deliberately, together with a typescript-eslint release that supports it, and lift this.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

      # @types/node is pinned to the major of the oldest Node the project supports, not the newest one it
      # runs on. Typing ahead of the floor is worse than useless: `tsc` starts accepting APIs that are
      # absent on the runtime `engines` promises, so the mistake surfaces for a contributor on the floor
      # rather than in CI. Move this in step with the floor in package.json.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # Without this, action versions silently rot; they were three majors behind within months.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
