# Checks every push and pull request, then packages the extension so a reviewer can install the exact
# build that passed. The artifact is what you upload to Chrome; see .github/workflows/release.yml for
# tagged releases.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result; knowing it fails only on the floor is the useful part.
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, the current LTS, and the release between them.
        node: ['20.11.0', '22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  package:
    name: Package extension
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Read version
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the build is loadable
        # Cheap guards against shipping something Chrome would reject or that leaks build detail:
        # every file the manifest needs must exist, and a production bundle must carry no sourcemap.
        run: |
          set -euo pipefail
          for f in manifest.json content.js background.js options.html; do
            test -f "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
          done
          node -e "
            const m = require('./dist/manifest.json');
            if (m.manifest_version !== 3) throw new Error('expected manifest_version 3');
            if (m.version !== require('./package.json').version) throw new Error('manifest version drifted from package.json');
          "
          if grep -q 'sourceMappingURL' dist/content.js; then
            echo "::error::production bundle contains a sourcemap reference"
            exit 1
          fi

      # Downloading this artifact gives you a zip with manifest.json at its root: unzip it and load it
      # with "Load unpacked", or upload the zip itself to the Chrome Web Store dashboard.
      - uses: actions/upload-artifact@v7
        with:
          name: phishlens-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          path: dist/
          if-no-files-found: error
