# Checks every push and pull request, then packages the extension so a reviewer can install the exact
# build that passed. The artifact is what you upload to Chrome; see .github/workflows/release.yml for
# tagged releases.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result; knowing it fails only on the floor is the useful part.
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, and the current LTS.
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  package:
    name: Package extension
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Read version
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Guards against shipping something Chrome would reject, or that works but leaks build detail. The
      # release workflow runs the same script before publishing, so the download and the artifact are held
      # to one standard.
      - name: Check the build is loadable
        run: npm run check:dist

      # Downloading this artifact gives you a zip with manifest.json at its root: unzip it and load it
      # with "Load unpacked", or upload the zip itself to the Chrome Web Store dashboard.
      - uses: actions/upload-artifact@v7
        with:
          name: phishlens-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          path: dist/
          if-no-files-found: error
